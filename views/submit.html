<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit</title>
  <link rel="stylesheet" href="/public/style.css" />

  <style>
    /* Mobile-friendly page wrapper that matches your cool dark theme */
    body{
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 30% 20%, #2b2f6b 0%, #0b0d1a 55%, #05060d 100%);
      overflow-x: hidden;
    }

    .bg-glow{
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 20%, rgba(79,172,254,0.28), transparent 55%),
        radial-gradient(circle at 85% 35%, rgba(255,215,0,0.18), transparent 50%),
        radial-gradient(circle at 60% 90%, rgba(255,0,128,0.12), transparent 55%);
      filter: blur(22px);
      animation: slowDrift 14s ease-in-out infinite alternate;
      opacity: 0.9;
    }

    @keyframes slowDrift{
      from { transform: translate3d(-1%, -0.8%, 0) scale(1.05); }
      to   { transform: translate3d( 1%,  0.8%, 0) scale(1.10); }
    }

    /* Override the .container a bit for small screens */
    .container.submit{
      position: relative;
      z-index: 2;
      max-width: 560px;
      margin: 18px auto;
      padding: 18px;
      border-radius: 18px;
      background: rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 22px 80px rgba(0,0,0,0.65);
    }

    h1{
      margin: 6px 0 14px;
      font-size: 30px;
      font-weight: 950;
      letter-spacing: 0.3px;
    }

    .subtext{
      margin: 0 0 14px;
      opacity: 0.82;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
    }

    label{
      display:block;
      margin: 14px 0 8px;
      font-weight: 900;
      opacity: 0.92;
      font-size: 14px;
    }

    input[type="text"]{
      width: 100%;
      box-sizing: border-box;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 16px; /* prevents iOS zoom */
      outline: none;
    }

    input[type="text"]::placeholder{
      opacity: 0.6;
    }

    /* File input: make it easier on mobile */
    .fileRow{
      display: grid;
      gap: 10px;
    }

    input[type="file"]{
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.85);
      font-size: 14px;
    }

    .previewWrap{
      display: none;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    }

    .previewWrap img{
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: rgba(0,0,0,0.25);
    }

    button{
      width: 100%;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(79,172,254,0.32);
      background: rgba(79,172,254,0.16);
      color: #fff;
      font-weight: 950;
      font-size: 16px;
      letter-spacing: 0.2px;
      cursor: pointer;
    }

    button:active{
      transform: translateY(1px);
    }

    .msg{
      margin-top: 14px;
      font-weight: 800;
      opacity: 0.9;
      text-align: center;
      min-height: 22px;
    }

    .doneCard{
      margin-top: 20px;
      text-align:center;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .doneEmoji{ font-size: 64px; }
    .doneTitle{
      font-size: 22px;
      font-weight: 950;
      margin-top: 8px;
    }
    .doneText{
      opacity: 0.85;
      font-weight: 700;
      margin-top: 6px;
    }

    /* Make it feel nicer on very small screens */
    @media (max-width: 420px){
      h1{ font-size: 26px; }
      .previewWrap img{ height: 220px; }
      .container.submit{ margin: 10px; }
    }
  </style>
</head>

<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="container submit">
    <h1 id="title">Upload your image</h1>
    <p class="subtext">One photo per person. Pick your best New Year moment 🎆</p>

    <form id="form">
      <label>Name</label>
      <input type="text" name="name" required maxlength="50" placeholder="Your name" />

      <label>Image</label>
      <div class="fileRow">
        <input id="fileInput" type="file" name="image" accept="image/*" required />
        <div id="previewWrap" class="previewWrap">
          <img id="previewImg" alt="Preview">
        </div>
      </div>

      <button id="submitBtn" type="submit">Submit</button>
    </form>

    <p id="msg" class="msg"></p>
  </main>

<script>
const form = document.getElementById("form");
const msg = document.getElementById("msg");
const title = document.getElementById("title");
const fileInput = document.getElementById("fileInput");
const previewWrap = document.getElementById("previewWrap");
const previewImg = document.getElementById("previewImg");
const submitBtn = document.getElementById("submitBtn");

/* ---------- Image preview (mobile-friendly) ---------- */
fileInput.addEventListener("change", () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) {
    previewWrap.style.display = "none";
    previewImg.src = "";
    return;
  }

  const url = URL.createObjectURL(file);
  previewImg.src = url;
  previewWrap.style.display = "block";
});

/* ---------- Check if user already uploaded ---------- */
async function checkAlreadyUploaded(){
  try {
    const res = await fetch("/api/me", { cache: "no-store" });
    const data = await res.json();

    if (data.mySubmissionId) {
      form.remove();
      title.textContent = "Upload complete";

      msg.innerHTML = `
        <div class="doneCard">
          <div class="doneEmoji">😊</div>
          <div class="doneTitle">You already uploaded a photo</div>
          <div class="doneText">Thanks for participating!</div>
        </div>
      `;
      return;
    }
  } catch (err) {
    console.error("Failed to check upload status", err);
  }
}
checkAlreadyUploaded();

/* ---------- Handle upload ---------- */
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  //TODO msg.textContent = "Uploading...";

  submitBtn.disabled = true;
  submitBtn.textContent = "Uploading…";

  try {
    const fd = new FormData(form);

    const res = await fetch("/api/upload", {
      method: "POST",
      body: fd
    });

    if (!res.ok) {
      const txt = await res.text();
      msg.textContent = txt || "Upload failed";
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";
      return;
    }

    // Success → hide form
    form.remove();
    title.textContent = "Upload complete";

    msg.innerHTML = `
      <div class="doneCard">
        <div class="doneEmoji">😊</div>
        <div class="doneTitle">Your picture is uploaded!</div>
        <div class="doneText">Thank you for participating 🎉</div>
      </div>
    `;
  } catch (err) {
    console.error(err);
    msg.textContent = "Upload failed (network or server error)";
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
  }
});
</script>
</body>
</html>
