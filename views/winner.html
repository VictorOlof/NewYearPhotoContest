<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🏆 Winner</title>

  <link rel="stylesheet" href="/public/style.css" />

  <style>
    /* Same background as slideshow */
    body{
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 30% 20%, #2b2f6b 0%, #0b0d1a 55%, #05060d 100%);
      overflow: hidden;
    }

    .bg-glow{
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 20%, rgba(79,172,254,0.28), transparent 55%),
        radial-gradient(circle at 85% 35%, rgba(255,215,0,0.18), transparent 50%),
        radial-gradient(circle at 60% 90%, rgba(255,0,128,0.12), transparent 55%);
      filter: blur(22px);
      animation: slowDrift 14s ease-in-out infinite alternate;
      opacity: 0.9;
    }

    @keyframes slowDrift{
      from { transform: translate3d(-1%, -0.8%, 0) scale(1.05); }
      to   { transform: translate3d( 1%,  0.8%, 0) scale(1.10); }
    }

    .container.show{
      max-width: 2000px;
      margin: 20px auto;
      padding: 28px;
      position: relative;
      z-index: 2;
      background: rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 22px 80px rgba(0,0,0,0.65);
      border-radius: 20px;
    }

    .header{
      display:flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .header h1{
      margin: 0;
      font-size: 42px;
      font-weight: 950;
      letter-spacing: 0.5px;
    }

    .status{
      font-weight: 800;
      opacity: 0.9;
      font-size: 16px;
    }

    /* Winner layout (like slideshow, but single slide) */
    .winner{
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 26px;
      align-items: center;
      min-height: 72vh;
    }

    .imgWrap{
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
    }

    .imgWrap img{
      width: 100%;
      height: 72vh;
      object-fit: contain;
      display: block;
      background: rgba(0,0,0,0.25);
    }

    .winnerText{
      display: grid;
      gap: 18px;
    }

    .badge{
      font-size: 20px;
      font-weight: 900;
      padding: 10px 16px;
      border-radius: 999px;
      width: fit-content;
      background: rgba(255,215,0,0.18);
      border: 1px solid rgba(255,215,0,0.35);
    }

    .name{
      font-size: 64px;
      font-weight: 950;
      line-height: 1.05;
      word-break: break-word;
    }

    .votes{
      font-size: 26px;
      font-weight: 900;
      opacity: 0.9;
    }

    .hint{
      margin-top: 12px;
      font-size: 16px;
      opacity: 0.75;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="container show">
    <div class="header">
      <h1>🏆 Winner</h1>
      <div class="status" id="status">Loading…</div>
    </div>

    <div id="content" class="winner"></div>
  </main>

<script>
const content = document.getElementById("content");
const statusEl = document.getElementById("status");

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );
}

function nowTime(){
  return new Date().toLocaleTimeString([], {
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
}

async function loadWinner(){
  try{
    const res = await fetch("/api/submissions", { cache: "no-store" });
    const items = await res.json();

    if (!items.length){
      content.innerHTML = `
        <div class="winnerText">
          <div class="name">No winner yet</div>
          <div class="hint">Waiting for submissions…</div>
        </div>
      `;
      statusEl.textContent = `Updated ${nowTime()}`;
      return;
    }

    // Sort by votes DESC, stable fallback by id
    items.sort((a,b) =>
      (b.votes || 0) - (a.votes || 0) || (a.id || 0) - (b.id || 0)
    );

    const winner = items[0];

    content.innerHTML = `
      <div class="imgWrap">
        <img src="${winner.displayPath || winner.imagePath}" alt="">
      </div>

      <div class="winnerText">
        <div class="badge">🥇 1st place</div>
        <div class="name">${escapeHtml(winner.name)}</div>
        <div class="votes">⭐ ${winner.votes} votes</div>
        <div class="hint">Congratulations!</div>
      </div>
    `;

    statusEl.textContent = `Votes counted • Updated ${nowTime()}`;

  } catch {
    statusEl.textContent = `⚠️ Connection issue • ${nowTime()}`;
  }
}

loadWinner();
</script>
</body>
</html>
