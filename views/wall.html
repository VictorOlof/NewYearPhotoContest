<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎆 Wall of Fame</title>

  <link rel="stylesheet" href="/public/style.css" />

  <style>
    /* ---------- Global background (constant) ---------- */
    body{
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 30% 20%, #2b2f6b 0%, #0b0d1a 55%, #05060d 100%);
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Subtle animated glow (always on, same during fireworks) */
    .bg-glow{
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 20%, rgba(79,172,254,0.28), transparent 55%),
        radial-gradient(circle at 85% 35%, rgba(255,215,0,0.18), transparent 50%),
        radial-gradient(circle at 60% 90%, rgba(255,0,128,0.12), transparent 55%);
      filter: blur(22px);
      animation: slowDrift 14s ease-in-out infinite alternate;
      opacity: 0.9;
    }

    @keyframes slowDrift{
      from { transform: translate3d(-1%, -0.8%, 0) scale(1.05); }
      to   { transform: translate3d( 1%,  0.8%, 0) scale(1.10); }
    }

    /* Fireworks canvas (only draws during bursts) */
    #fireworks{
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ---------- Content ---------- */
    .container.wall{
      max-width: 2000px;
      margin: 20px auto;
      padding: 22px;
      position: relative;
      z-index: 2;
      background: rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 22px 80px rgba(0,0,0,0.65);
      border-radius: 18px;
    }

    .wallHeader{
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .wallTitle{
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }

    .wallTitle h1{
      margin: 0;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    .wallStatus{
      font-weight: 800;
      opacity: 0.9;
      font-size: 15px;
      white-space: nowrap;
    }

    /* Toggle */
    .toggle{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      font-size:14px;
      opacity:0.95;
      user-select:none;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .toggle input{
      width: 18px;
      height: 18px;
      accent-color: #4facfe;
    }

    /* ---------- BIG grid for TV ---------- */
    .grid.wallGrid{
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
      margin-top: 16px;
    }

    .card.wallCard{
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    }

    .card.wallCard img{
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .meta.wallMeta{
      padding: 14px 16px;
      display: grid;
      gap: 8px;
    }

    .meta.wallMeta strong{
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- New upload spotlight ---------- */
    #spotlight{
      display: none;
      margin-top: 16px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
    }

    #spotlight .spotImg{
      width: 100%;
      height: 62vh;
      object-fit: contain;
      display: block;
      background: rgba(0,0,0,0.25);
      cursor: pointer;
    }

    #spotlight .spotMeta{
      padding: 16px 16px 18px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 14px;
      flex-wrap: wrap;
    }

    #spotlight .spotName{
      font-size: 28px;
      font-weight: 950;
      letter-spacing: 0.3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 70%;
    }

    #spotlight .spotBadge{
      font-weight: 900;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,215,0,0.16);
      border: 1px solid rgba(255,215,0,0.35);
      white-space: nowrap;
    }

    /* ---------- Lightbox (fullscreen image view) ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: zoom-out;
      padding: 14px;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 30px 100px rgba(0,0,0,0.8);
    }
  </style>
</head>

<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>

  <main class="container wall">
    <div class="wallHeader">
      <div class="wallTitle">
        <h1>🎆 Wall of Fame</h1>
        <div class="wallStatus" id="status">Loading…</div>
      </div>

      <label class="toggle" title="If enabled, this page switches to slideshow after 30 seconds">
        <input type="checkbox" id="autoSlideToggle" checked />
        Auto slideshow
      </label>
    </div>

    <!-- Spotlight for new upload -->
    <div id="spotlight">
      <img id="spotImg" class="spotImg" alt="">
      <div class="spotMeta">
        <div id="spotName" class="spotName"></div>
        <div class="spotBadge">🎇 New upload!</div>
      </div>
    </div>

    <!-- Normal grid -->
    <div id="grid" class="grid wallGrid"></div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" alt="">
  </div>

<script>
/* ================= Redirect toggle ================= */
const WALL_TO_SLIDESHOW_MS = 12000; // <-- change delay here (ms)

const autoSlideToggle = document.getElementById("autoSlideToggle");
let wallRedirectTimer = null;
let lastItemCount = 0;

// restore saved state (default ON)
const saved = localStorage.getItem("autoSlideEnabled");
autoSlideToggle.checked = saved !== "false";

autoSlideToggle.addEventListener("change", () => {
  localStorage.setItem("autoSlideEnabled", String(autoSlideToggle.checked));
  resetWallRedirect();
  armWallRedirectIfNeeded();
});

function resetWallRedirect() {
  if (wallRedirectTimer) {
    clearTimeout(wallRedirectTimer);
    wallRedirectTimer = null;
  }
}

function armWallRedirectIfNeeded() {
  if (!autoSlideToggle.checked) return;
  if (lastItemCount === 0) return;
  if (wallRedirectTimer) return;

  // ✅ don't arm while spotlight is active
  if (Date.now() < spotlightUntil) return;

  wallRedirectTimer = setTimeout(() => {
    if (autoSlideToggle.checked && lastItemCount > 0) {
      window.location.href = "/slideshow";
    } else {
      resetWallRedirect();
    }
  }, WALL_TO_SLIDESHOW_MS);
}

/* ================= Lightbox ================= */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

function openLightbox(e, src) {
  e.stopPropagation();
  lightboxImg.src = src;
  lightbox.style.display = "flex";
  // lock background scroll on mobile while open
  document.body.style.overflow = "hidden";
}

function closeLightbox() {
  lightbox.style.display = "none";
  lightboxImg.src = "";
  document.body.style.overflow = "";
}

/* ================= Live Wall ================= */
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");

const spotlight = document.getElementById("spotlight");
const spotImg = document.getElementById("spotImg");
const spotName = document.getElementById("spotName");

const REFRESH_SECONDS = 4;
let lastSignature = "";
let lastMaxId = 0;
let firstLoad = true;

let spotlightUntil = 0;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );
}

function nowTime(){
  return new Date().toLocaleTimeString([], {
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
}

function signature(items){
  return items.map(i => `${i.id}:${i.imagePath}:${i.name}`).join("|");
}

function showSpotlight(item, ms){
  // ✅ pause/reset redirect timer while spotlight is active
  resetWallRedirect();

  spotlightUntil = Date.now() + ms;

  // Hide grid, show spotlight
  grid.style.display = "none";
  spotlight.style.display = "block";

  const src = item.displayPath || item.imagePath;
  spotImg.src = src;
  spotName.textContent = item.name || "";

  // lightbox for spotlight
  spotImg.onclick = (e) => openLightbox(e, src);

  // fireworks for same duration
  startFireworksBurst(ms);

  // ensure it returns even if no refresh happens
  setTimeout(() => {
    if (Date.now() >= spotlightUntil) {
      spotlight.style.display = "none";
      grid.style.display = "";

      // ✅ restart redirect timer after spotlight ends
      armWallRedirectIfNeeded();
    }
  }, ms);
}

function renderGrid(items){
  grid.innerHTML = items.map(i => {
    const src = i.displayPath || i.imagePath;
    return `
      <div class="card wallCard">
        <img src="${src}" alt="" onclick="openLightbox(event, '${src}')">
        <div class="meta wallMeta">
          <strong title="${escapeHtml(i.name)}">${escapeHtml(i.name)}</strong>
        </div>
      </div>
    `;
  }).join("");
}

async function refresh(){
  try{
    const res = await fetch("/api/submissions", { cache: "no-store" });
    const items = await res.json();

    // newest-first for detecting new uploads
    items.sort((a,b) => (b.id||0) - (a.id||0));

    const maxId = items.length ? items[0].id : 0;
    const newUpload = (!firstLoad && maxId > lastMaxId);
    const newItem = newUpload ? items[0] : null;

    lastMaxId = maxId;
    firstLoad = false;

    lastItemCount = items.length;

    // arm redirect if enabled & not spotlighting
    armWallRedirectIfNeeded();

    // only re-render grid if changed AND not spotlighting right now
    const sig = signature(items);
    const inSpotlight = Date.now() < spotlightUntil;

    if (!inSpotlight && sig !== lastSignature){
      lastSignature = sig;
      renderGrid(items);
    }

    // new upload -> spotlight 5s
    if (newUpload && newItem){
      showSpotlight(newItem, 5000);
    }

    const spotLeft = Math.max(0, Math.ceil((spotlightUntil - Date.now()) / 1000));
    const burstLeft = Math.max(0, Math.ceil((fireworksUntil - Date.now()) / 1000));

    statusEl.textContent =
      `Images: ${items.length} • Updated ${nowTime()}` +
      (spotLeft > 0 ? ` • 🆕 Spotlight ${spotLeft}s` : "") +
      (spotLeft === 0 && burstLeft > 0 ? ` • 🎇 ${burstLeft}s` : "");

  } catch {
    statusEl.textContent = `⚠️ Connection issue • ${nowTime()}`;
  }
}

refresh();
setInterval(refresh, REFRESH_SECONDS * 1000);

/* ================= Fireworks (FAST, TEMPORARY) ================= */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let W = 0, H = 0;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function rand(min, max){ return min + Math.random() * (max - min); }

const rockets = [];
const sparks = [];

let fireworksUntil = 0;
let animating = false;
let rocketTimer = 0;

function startFireworksBurst(ms){
  fireworksUntil = Math.max(fireworksUntil, Date.now() + ms);
  if (!animating){
    animating = true;
    requestAnimationFrame(tick);
  }
}

function spawnRocket(){
  const x = rand(W * 0.15, W * 0.85);
  const y = H + 30;
  const targetY = rand(H * 0.15, H * 0.45);
  rockets.push({
    x, y,
    vx: rand(-0.9, 0.9),
    vy: rand(-12, -16),
    targetY,
    life: 120
  });
}

function explode(x, y){
  const count = Math.floor(rand(80, 140));
  for (let i = 0; i < count; i++){
    const a = rand(0, Math.PI * 2);
    const sp = rand(2, 10);
    sparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      g: rand(0.08, 0.14),
      size: rand(1.6, 3.4),
      life: Math.floor(rand(45, 90)),
      drag: rand(0.965, 0.985)
    });
  }
}

function tick(){
  const now = Date.now();
  const active = now < fireworksUntil;

  ctx.fillStyle = active ? "rgba(0,0,0,0.18)" : "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  if (active){
    rocketTimer--;
    if (rocketTimer <= 0){
      const burst = Math.random() < 0.35 ? 2 : 1;
      for (let i = 0; i < burst; i++) spawnRocket();
      rocketTimer = Math.floor(rand(14, 28));
    }
  }

  // rockets
  for (let i = rockets.length - 1; i >= 0; i--){
    const r = rockets[i];
    r.x += r.vx;
    r.y += r.vy;
    r.vy += 0.18;

    ctx.beginPath();
    ctx.arc(r.x, r.y, 2.3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fill();

    if (r.y <= r.targetY || r.life-- <= 0){
      explode(r.x, r.y);
      rockets.splice(i, 1);
    }
  }

  // sparks
  for (let i = sparks.length - 1; i >= 0; i--){
    const p = sparks[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.g;
    p.vx *= p.drag;
    p.vy *= p.drag;

    const alpha = Math.max(0, p.life / 90);
    ctx.globalAlpha = alpha;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * 2.3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,215,0,0.22)";
    ctx.fill();

    p.life--;
    if (p.life <= 0 || p.y > H + 80 || p.x < -80 || p.x > W + 80){
      sparks.splice(i, 1);
    }
  }

  ctx.globalAlpha = 1;

  if (active || rockets.length || sparks.length){
    requestAnimationFrame(tick);
  } else {
    ctx.clearRect(0, 0, W, H);
    animating = false;
  }
}
</script>
</body>
</html>
